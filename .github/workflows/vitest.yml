name: Run Tests

on:
  pull_request:
    branches: [main]
  workflow_call: # allows this workflow to be called by other workflows

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Or specify a exact version like 1.1.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bun run test # Or 'bun run test' depending on your package.json script
